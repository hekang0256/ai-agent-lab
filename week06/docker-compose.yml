# week06 专用：带 pgvector 扩展的 PostgreSQL 16
# 与 week01 的 postgres 容器相互独立（端口 5433，避免冲突）
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai_agent_lab_pgvector
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab123
      POSTGRES_DB: ai_agent_lab_vector
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      # 首次启动自动执行：CREATE EXTENSION vector + 建表
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d ai_agent_lab_vector"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgvector_data:
