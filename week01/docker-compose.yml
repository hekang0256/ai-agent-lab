services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_agent_lab_pg
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab123
      POSTGRES_DB: ai_agent_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d ai_agent_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
